name: Cleanup Workflow History
on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日零点运行
  workflow_dispatch:     # 支持手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: igorjs/gh-actions-clean-workflow@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep: 5  # 保留最近100条记录
          # dry_run: true  # 建议先开启试运行
